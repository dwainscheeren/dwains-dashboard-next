<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
  </head>
  <body class="{% if page.url == '/' %}docs-home{% endif %}">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Dwains Dashboard Next documentation home">
          <img class="brand__mark" src="{{ '/assets/icon.png' | relative_url }}" alt="" aria-hidden="true">
          <span>
            <strong>Dwains Dashboard Next</strong>
            <small>Documentation</small>
          </span>
        </a>
        <nav class="site-nav" aria-label="Documentation navigation">
          <a href="{{ '/installation.html' | relative_url }}">Install</a>
          <a href="{{ '/getting-started.html' | relative_url }}">Start</a>
          <a href="{{ '/dashboard-settings.html' | relative_url }}">Settings</a>
          <a href="{{ '/areas.html' | relative_url }}">Areas</a>
          <a href="{{ '/devices.html' | relative_url }}">Devices</a>
          <a href="{{ '/blueprints.html' | relative_url }}">Blueprints</a>
          <a href="{{ '/screenshots.html' | relative_url }}">Screenshots</a>
          <a class="github-button" href="https://github.com/dwainscheeren/dwains-dashboard-next">
            <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.63 5.47 7.7.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.16-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.42 7.42 0 0 1 8 3.9c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.75.54 1.52 0 1.1-.01 1.98-.01 2.25 0 .21.15.47.55.39A8.03 8.03 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/>
            </svg>
            GitHub
          </a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <article class="content">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>Dwains Dashboard Next</span>
        <a href="https://github.com/dwainscheeren/dwains-dashboard-next">GitHub</a>
      </div>
    </footer>
  </body>
</html>
